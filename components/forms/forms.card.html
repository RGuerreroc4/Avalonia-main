<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:16px;background:var(--surface-page);font-family:var(--font-core);color:var(--text-body)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.col{display:flex;flex-direction:column;gap:12px}.lbl{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--text-tertiary)}</style></head><body><div id="root"></div>
<script type="text/babel">
const { TextBox, CheckBox, RadioButton, ToggleSwitch, ComboBox, Slider, SearchBox, SegmentedControl, PathIcon } = window.AvaloniaFluentDesignSystem_a08390;

function App(){
 const [q,setQ]=React.useState(''); const [c,setC]=React.useState(true); const [r,setR]=React.useState('fluent');
 const [s,setS]=React.useState(true); const [v,setV]=React.useState('Fluent'); const [n,setN]=React.useState(40); const [seg,setSeg]=React.useState('Rooms');
 return <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'20px'}}>
  <div className="col">
   <SearchBox placeholder="Search Project" value={q} onChange={setQ} />
   <SegmentedControl items={['Rooms','Categories']} value={seg} onChange={setSeg} />
   <TextBox label="Email Address" placeholder="name@example.com" />
   <TextBox label="Port" value="80x" error="Not a number" />
   <TextBox label="Disabled" placeholder="Unavailable" disabled />
  </div>
  <div className="col">
   <div className="row" style={{gap:'20px'}}><CheckBox checked={c} onChange={setC}>Checked</CheckBox><CheckBox>Unchecked</CheckBox><CheckBox indeterminate>Mixed</CheckBox><CheckBox disabled>Disabled</CheckBox></div>
   <div className="row" style={{gap:'20px'}}><RadioButton name="t" checked={r==='fluent'} onChange={()=>setR('fluent')}>Fluent</RadioButton><RadioButton name="t" checked={r==='simple'} onChange={()=>setR('simple')}>Simple</RadioButton><RadioButton disabled>Disabled</RadioButton></div>
   <div className="row" style={{gap:'20px'}}><ToggleSwitch checked={s} onChange={setS}/><ToggleSwitch offContent="Off"/><ToggleSwitch disabled/></div>
   <ComboBox items={['Fluent','Simple']} value={v} onChange={setV} style={{maxWidth:200}} />
   <Slider value={n} onChange={setN} showValue />
  </div>
 </div>; }
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
