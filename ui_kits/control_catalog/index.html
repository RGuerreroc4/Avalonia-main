<!doctype html><html><head><meta charset="utf-8"><title>ControlCatalog</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0;height:100%}#root{height:100vh}a{color:var(--text-link)}a:hover{color:var(--accent-light-1)}</style>
</head><body><div id="root"></div>
<script>window.CATALOG_ICONS = window.AvaloniaFluentDesignSystem_a08390.ICONS;</script>
<script type="text/babel" src="CatalogShell.jsx"></script>
<script type="text/babel" src="ButtonsScreen.jsx"></script>
<script type="text/babel" src="FormsScreen.jsx"></script>
<script type="text/babel" src="FeedbackScreen.jsx"></script>
<script type="text/babel">
const I = window.CATALOG_ICONS;
const PAGES = [
  { id: 'buttons', title: 'Buttons', icon: I.CursorClick || I.Cursor, render: () => <window.ButtonsScreen /> },
  { id: 'forms', title: 'Forms', icon: I.TextInput, render: () => <window.FormsScreen /> },
  { id: 'feedback', title: 'Feedback', icon: I.Bell, render: () => <window.FeedbackScreen /> },
  { id: 'layout', title: 'Layout', icon: I.Layout, render: () => <window.ButtonsScreen /> },
  { id: 'lists', title: 'Lists', icon: I.List, render: () => <window.FeedbackScreen /> },
  { id: 'theme', title: 'Theming', icon: I.Theme, render: () => <window.FormsScreen /> }
];
function App(){
  const [active, setActive] = React.useState('buttons');
  const page = PAGES.find(p => p.id === active);
  return <window.CatalogShell pages={PAGES} active={active} onSelect={setActive}>{page.render()}</window.CatalogShell>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
