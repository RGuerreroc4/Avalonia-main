<!doctype html><html><head><meta charset="utf-8"><title>Pulse</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0;min-height:100%}body{background:#0b0b0b;display:grid;place-items:start center;padding:10px 0}a{color:var(--pulse-accent)}a:hover{color:var(--pulse-accent-hover)}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="PulseShell.jsx"></script>
<script type="text/babel" src="PulseLogin.jsx"></script>
<script type="text/babel" src="PulseHome.jsx"></script>
<script type="text/babel" src="PulseDetail.jsx"></script>
<script type="text/babel" src="PulseProfile.jsx"></script>
<script type="text/babel">
function App(){
  const [stack, setStack] = React.useState(['login']);
  const [tab, setTab] = React.useState('home');
  const [workout, setWorkout] = React.useState(null);
  const top = stack[stack.length - 1];
  if (top === 'login')
    return <window.PulseShell>{<window.PulseLogin onLogin={() => setStack(['dashboard'])} />}</window.PulseShell>;
  if (top === 'detail')
    return <window.PulseShell title={workout ? workout.title : 'Workout'} onBack={() => setStack(s => s.slice(0, -1))}>
      <window.PulseDetail workout={workout} />
    </window.PulseShell>;
  return (
    <window.PulseShell showTabs tab={tab} onTab={setTab}>
      {tab === 'profile'
        ? <window.PulseProfile />
        : <window.PulseHome onOpen={w => { setWorkout(w); setStack(s => [...s, 'detail']); }} />}
    </window.PulseShell>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
