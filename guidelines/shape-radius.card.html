<!-- @dsCard group="Spacing" viewport="700x160" name="Corner radii" subtitle="4px controls, 8px overlays; Pulse uses 16px controls, 32px cards" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--surface-page);font-family:var(--font-core);color:var(--text-body)}.sw{display:flex;gap:0;border-radius:3px;overflow:hidden}.sw div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-size:9px;letter-spacing:.5px}.grid{display:flex;gap:12px;flex-wrap:wrap}.chip{display:flex;flex-direction:column;gap:6px;font-size:10px;color:var(--text-tertiary)}.chip b{font-weight:500;color:var(--text-body);font-size:11px}.box{width:96px;height:56px;border-radius:3px}</style></head><body>
<div class="grid">
<div class="chip"><div class="box" style="background:var(--surface-control);border-radius:var(--radius-control)"></div><b>4px</b>ControlCornerRadius</div>
<div class="chip"><div class="box" style="background:var(--surface-control);border-radius:var(--radius-overlay)"></div><b>8px</b>OverlayCornerRadius</div>
<div class="chip"><div class="box" style="background:var(--surface-control);border-radius:var(--radius-pulse-control)"></div><b>16px</b>Pulse control</div>
<div class="chip"><div class="box" style="background:var(--surface-control);border-radius:var(--radius-pulse-card)"></div><b>32px</b>Pulse card</div>
<div class="chip"><div class="box" style="background:var(--surface-control);border-radius:999px"></div><b>999px</b>pill / chip</div>
</div></body></html>
