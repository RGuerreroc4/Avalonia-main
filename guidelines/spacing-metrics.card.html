<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--surface-page);font-family:var(--font-core);color:var(--text-body)}.sw{display:flex;gap:0;border-radius:3px;overflow:hidden}.sw div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-size:9px;letter-spacing:.5px}.grid{display:flex;gap:12px;flex-wrap:wrap}.chip{display:flex;flex-direction:column;gap:6px;font-size:10px;color:var(--text-tertiary)}.chip b{font-weight:500;color:var(--text-body);font-size:11px}.box{width:96px;height:56px;border-radius:3px}</style></head><body>
<div class="grid" style="align-items:flex-end">
<div class="chip"><div style="width:120px;height:32px;background:var(--surface-control);border-radius:3px"></div><b>32px</b>control min height</div>
<div class="chip"><div style="width:20px;height:20px;background:var(--surface-accent);border-radius:3px"></div><b>20px</b>icon box</div>
<div class="chip"><div style="width:16px;height:16px;background:var(--surface-accent);border-radius:3px"></div><b>16px</b>nav / in-button icon</div>
<div class="chip"><div style="width:120px;height:4px;background:var(--surface-accent);border-radius:999px"></div><b>4px</b>progress track</div>
<div class="chip"><div style="width:120px;height:2px;background:var(--surface-accent)"></div><b>2px</b>slider track</div>
</div></body></html>
