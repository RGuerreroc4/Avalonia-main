<!-- @dsCard group="Colors" viewport="700x150" name="Status colours" subtitle="NotificationCard brushes plus the error-text and visited-link colours" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--surface-page);font-family:var(--font-core);color:var(--text-body)}.sw{display:flex;gap:0;border-radius:3px;overflow:hidden}.sw div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-size:9px;letter-spacing:.5px}.grid{display:flex;gap:12px;flex-wrap:wrap}.chip{display:flex;flex-direction:column;gap:6px;font-size:10px;color:var(--text-tertiary)}.chip b{font-weight:500;color:var(--text-body);font-size:11px}.box{width:96px;height:56px;border-radius:3px}</style></head><body>
<div class="grid">
<div class="chip"><div class="box" style="background:var(--status-info)"></div><b>Information</b>#0078D4</div>
<div class="chip"><div class="box" style="background:var(--status-success)"></div><b>Success</b>#7ED321</div>
<div class="chip"><div class="box" style="background:var(--status-warning)"></div><b>Warning</b>#F57D1B</div>
<div class="chip"><div class="box" style="background:var(--status-error)"></div><b>Error</b>#F03916</div>
<div class="chip"><div class="box" style="background:var(--error-text)"></div><b>ErrorText</b>#F03916</div>
<div class="chip"><div class="box" style="background:var(--hyperlink-visited)"></div><b>Visited link</b>#681DA8</div>
</div></body></html>
