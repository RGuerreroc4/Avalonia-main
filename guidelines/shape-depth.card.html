<!-- @dsCard group="Spacing" viewport="700x170" name="Depth &amp; borders" subtitle="Fluent has no elevation ramp — depth is a 1px transient border" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--surface-page);font-family:var(--font-core);color:var(--text-body)}.sw{display:flex;gap:0;border-radius:3px;overflow:hidden}.sw div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-size:9px;letter-spacing:.5px}.grid{display:flex;gap:12px;flex-wrap:wrap}.chip{display:flex;flex-direction:column;gap:6px;font-size:10px;color:var(--text-tertiary)}.chip b{font-weight:500;color:var(--text-body);font-size:11px}.box{width:96px;height:56px;border-radius:3px}</style></head><body>
<div class="grid">
<div class="chip"><div class="box" style="background:var(--surface-card);border:1px solid var(--border-hairline)"></div><b>Hairline</b>BaseLow 1px</div>
<div class="chip"><div class="box" style="background:var(--surface-transient);border:1px solid var(--border-transient);border-radius:5px;box-shadow:var(--shadow-flyout)"></div><b>Transient</b>flyouts only</div>
<div class="chip"><div class="box" style="background:var(--surface-input);border:1px solid var(--border-control)"></div><b>1px</b>resting input</div>
<div class="chip"><div class="box" style="background:var(--surface-input-focus);border:1px solid var(--border-focus);box-shadow:inset 0 0 0 1px var(--border-focus)"></div><b>Inset ring</b>focused input</div>
</div></body></html>
